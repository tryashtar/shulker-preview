minecraft: '1.20'
data_pack:
  load: [in/datapack]
resource_pack:
  load: [in/resourcepack]
pipeline: [plugins.plugin_full, mecha]
meta:
  mecha:
    readonly: true
  model_resolver:
    preferred_minecraft_generated: java
    special_rendering: true
    use_cache: true
  shulker_preview:
    target_version:
      from: '1.20.5'
      to: '1.20.6'
    plugin: 2
